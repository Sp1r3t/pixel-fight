<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Fight — новые анимации</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui;background:#10131e;color:#e9eef9}body{margin:0}main{max-width:1120px;margin:auto;padding:28px}h1{font-size:28px;margin:0 0 6px}p{color:#aebbd2;margin:8px 0}.bar{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}button,select{font:inherit;border:1px solid #364259;background:#1b2539;color:#f2f6ff;padding:10px 14px;border-radius:8px;cursor:pointer}button.active{background:#4766d9;border-color:#8da1ff}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:24px}.stage{position:relative;min-height:360px;border:1px solid #354364;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#27365e,#151c32 75%)}.stage:after{content:'';position:absolute;bottom:38px;left:0;right:0;height:2px;background:#5c7093}canvas{width:min(100%,340px);height:auto;display:block;margin:0 auto;image-rendering:pixelated;position:relative;z-index:1}.badge{position:absolute;top:15px;left:18px;color:#9ab6ff;font-size:13px;z-index:2}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.info{padding:22px;background:#182135;border:1px solid #354364;border-radius:16px}.info h2{margin:0;font-size:24px}.tags{display:flex;gap:8px;margin:12px 0}.tag{padding:4px 9px;border-radius:20px;background:#2b3750;color:#bcd0f6;font-size:13px}.reference{width:220px;height:220px;overflow:hidden;margin:18px 0;background-size:200% 200%;background-repeat:no-repeat;border:1px solid #43516a;border-radius:12px;image-rendering:pixelated}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{font-size:13px;padding:7px 10px}.progress{height:5px;background:#263451;border-radius:4px;overflow:hidden}.progress i{display:block;background:#839dff;height:100%;width:0}a{color:#a7c2ff}details{margin-top:22px}.muted{font-size:13px;color:#8ea0ba}.warn{color:#ffd27e}.frames{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.frames canvas{background:#1c263b;border-radius:7px}.footer{margin-top:24px;border-top:1px solid #2b3750;padding-top:16px;font-size:13px;color:#99a9c4}@media(max-width:740px){main{padding:16px}.layout{grid-template-columns:1fr}.stage{min-height:360px}h1{font-size:23px}}
</style>
<main><h1>Новые образы в движении</h1><p>Персонажи и боссы · атаки оружием · отдельные комбо и ульты</p>
<div class="bar"><select id="character" aria-label="Персонаж"></select><button id="combo" class="active">Комбо</button><button id="ultimate">Ульта</button><button id="pause">Пауза</button><select id="speed" aria-label="Скорость"><option value="1">Обычная скорость</option><option value="0.5">Замедлить ×2</option><option value="0.25">Замедлить ×4</option></select></div>
<div class="layout"><div><div class="stage"><span class="badge" id="playing"></span><canvas id="stage" width="512" height="512"></canvas></div><div class="progress"><i id="progress"></i></div><div class="controls"><button id="previous">← Кадр</button><button id="next">Кадр →</button><button id="facing">Повернуть</button><label><input id="loop" type="checkbox" checked> Повторять</label></div><div class="actions" id="actions"></div></div>
<aside class="info"><h2 id="name"></h2><div class="tags" id="tags"></div><p id="weapon"></p><p id="signature"></p><p id="status" class="muted"></p><div class="reference" id="reference"></div><span class="muted">Утверждённый эскиз</span><details><summary>Скачать листы PNG</summary><div id="downloads"></div></details></aside></div>
<details id="frameDetails"><summary>Посмотреть последовательность кадров</summary><div class="frames" id="frames"></div></details><div class="footer" id="total"></div></main>
<script src="manifest.js"></script><script>
const M=window.SKIN_MANIFEST,chars=Object.values(M.characters),$=id=>document.getElementById(id);
const names={Idle:'Стойка',Walk:'Ходьба',Dash:'Рывок',Jump:'Прыжок вперёд',BackJump:'Прыжок назад',Crouch:'Приседание',Block:'Блок',Hit:'Получение удара',Knockdown:'Падение',WakeUp:'Вставание',Light:'Удар 1',Light2:'Удар 2',Light3:'Удар 3',Heavy:'Сильный удар',CrouchLight:'Удар сидя',CrouchHeavy:'Сильный удар сидя',AirLight:'Удар в воздухе',AirHeavy:'Сильный удар в воздухе',Special:'Спецприём',Super:'Ульта',Pulled:'Притягивание',Grabbed:'В захвате',Lifted:'Подъём жертвы',Thrown:'Жертву бросают',Launched:'Подбрасывание',Slammed:'Удар о землю',Bound:'Сковывание',Suspended:'Зависание'};
const weapons={Wraps:'Кулаки в бинтах',Kickboxer:'Кикбоксинг',Grappler:'Захваты и броски',Boxing:'Боксёрские перчатки',Disc:'Метательные диски',DualKnives:'Парные ножи',DualBatons:'Парные дубинки',Spear:'Копьё',Fans:'Боевые веера',Staff:'Посох',Katana:'Катана',Drone:'Дроны',ChainSickle:'Клинок на цепи',Magic:'Магия',Club:'Дубина',Hammer:'Молот',Talons:'Когти',Shield:'Ледяной щит',Bells:'Колокола',OrbitBlades:'Орбитальные клинки'},roles={balanced:'Универсал',agile:'Ловкий',tank:'Танк',ranged:'Дальняя дистанция'};
const panels=['motion','defense','combat','situational','recovery','super','reactions-grab','reactions-control'];
let c=chars[0],sequence=[],mode='Combo',elapsed=0,paused=false,flip=false,last=performance.now(),images=new Map();
for(const kind of ['fighter','boss']){const group=document.createElement('optgroup');group.label=kind==='fighter'?'Персонажи':'Боссы';for(const x of chars.filter(x=>x.kind===kind)){const o=document.createElement('option');o.value=x.id;o.textContent=x.id[0].toUpperCase()+x.id.slice(1);group.append(o);}$('character').append(group);}
for(const key of Object.keys(names)){const b=document.createElement('button');b.textContent=names[key];b.onclick=()=>select(key);b.dataset.action=key;$('actions').append(b);}
function getImage(file){if(!images.has(file)){const im=new Image();im.src=file;images.set(file,im);}return images.get(file);}
function actionFrames(key){const a=M.animations[key],panel=c.panels[panels[a.page-1]];if(!panel?.file)return [];return Array.from({length:a.frames},(_,i)=>({key,file:panel.file,x:(i%M.columns)*M.frameWidth,y:(a.row+Math.floor(i/M.columns))*M.frameHeight,fps:a.fps}));}
function select(key){mode=key;sequence=key==='Combo'?['Light','Light2','Light3','Heavy'].flatMap(actionFrames):actionFrames(key);elapsed=0;paused=false;$('pause').textContent='Пауза';$('playing').textContent=key==='Combo'?'Комбо: 1 → 2 → 3 → сильный':names[key];$('combo').classList.toggle('active',key==='Combo');$('ultimate').classList.toggle('active',key==='Super');document.querySelectorAll('[data-action]').forEach(b=>b.classList.toggle('active',b.dataset.action===key));if(!sequence.length)$('playing').textContent+=' · кадры пока отсутствуют';renderFrames();}
function selectCharacter(id){c=M.characters[id];$('name').textContent=c.id[0].toUpperCase()+c.id.slice(1);$('tags').innerHTML=`<span class="tag">${c.kind==='boss'?'Босс':'Персонаж'}</span><span class="tag">${roles[c.role]}</span>`;$('weapon').textContent=weapons[c.weapon]||c.weapon;$('signature').textContent=c.super.split(':')[0];$('status').textContent=`Подготовлено ${Object.values(c.panels).filter(x=>x.file).length} из 8 листов · ${c.frameCount} кадров`;$('reference').style.backgroundImage=`url(../${c.reference})`;$('reference').style.backgroundPosition=(c.quadrant.includes('left')?'left':'right')+' '+(c.quadrant.includes('top')?'top':'bottom');$('downloads').replaceChildren();for(const p of panels){const e=c.panels[p];if(e?.file){const a=document.createElement('a');a.href=e.file;a.download='';a.textContent=p;a.style.display='block';$('downloads').append(a);}}select(mode);}
function drawFrame(canvas,f){const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);if(!f)return;const im=getImage(f.file);if(!im.complete||!im.naturalWidth)return;ctx.imageSmoothingEnabled=false;ctx.save();if(flip){ctx.translate(canvas.width,0);ctx.scale(-1,1);}ctx.drawImage(im,f.x,f.y,M.frameWidth,M.frameHeight,0,0,canvas.width,canvas.height);ctx.restore();}
function renderFrames(){$('frames').replaceChildren();for(const f of sequence){const box=document.createElement('div'),canvas=document.createElement('canvas');canvas.width=256;canvas.height=256;box.append(canvas);const label=document.createElement('span');label.textContent=names[f.key];label.className='muted';box.append(label);$('frames').append(box);const im=getImage(f.file);if(im.complete)drawFrame(canvas,f);else im.addEventListener('load',()=>drawFrame(canvas,f),{once:true});}}
function tick(now){const dt=Math.min((now-last)/1000,.1);last=now;if(!paused)elapsed+=dt*Number($('speed').value);const fps=mode==='Super'?8:mode==='Idle'?6:12,duration=sequence.length/fps;let index=Math.min(Math.floor(elapsed*fps),sequence.length-1);if($('loop').checked&&duration){elapsed%=duration;index=Math.floor(elapsed*fps);}drawFrame($('stage'),sequence[index]);$('progress').style.width=duration?`${Math.min(100,elapsed/duration*100)}%`:'0';requestAnimationFrame(tick);}
$('character').onchange=e=>selectCharacter(e.target.value);$('combo').onclick=()=>select('Combo');$('ultimate').onclick=()=>select('Super');$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Продолжить':'Пауза';};$('previous').onclick=()=>{paused=true;elapsed=Math.max(0,elapsed-1/(mode==='Super'?8:12));};$('next').onclick=()=>{paused=true;elapsed+=1/(mode==='Super'?8:12);};$('facing').onclick=()=>{flip=!flip;renderFrames();};$('total').textContent=`${chars.filter(x=>x.kind==='fighter').length} персонажей · ${chars.filter(x=>x.kind==='boss').length} боссов. Изображения основаны на утверждённых новых эскизах.`;selectCharacter(c.id);requestAnimationFrame(tick);
</script></html>
