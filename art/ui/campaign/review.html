<!doctype html><html lang="ru"><meta charset="utf-8"><title>Pixel Fight — новый интерфейс</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1015;color:#e8e0cf;font:14px Arial;display:flex;flex-direction:column;align-items:center;padding:25px}nav{display:flex;gap:8px;margin-bottom:16px}button{background:#24343f;border:1px solid #786348;color:inherit;padding:9px 16px;border-radius:3px;cursor:pointer}button.active{background:#99522f;border-color:#dbb878}.stage{position:relative;width:960px;height:540px;background:#101820;overflow:hidden;box-shadow:0 20px 70px #0008;border:1px solid #594b39}.node{position:absolute}.caption{opacity:.65;margin:16px 0 0;font-size:12px}
</style><nav id="nav"></nav><main class="stage" id="stage"></main><p class="caption">Композиция из игровых компонентов. Анимации и рендеринг шрифтов в Roblox могут отличаться.</p>
<script>
Promise.all([fetch('screens.json').then(r=>r.json()),fetch('image-map.json').then(r=>r.json())]).then(([pages,images])=>{
 const normalize=n=>{n.children=Object.values(n.children||{});n.children.forEach(normalize);};pages.forEach(p=>{normalize(p.background);normalize(p.layout);});
 const color=(c,a=1)=>c?`rgba(${c.map(v=>Math.round(v*255)).join(',')},${a})`:'transparent';
 const mul=(a,b)=>(a||[1,1,1]).map((v,i)=>v*b[i]);
 const dim=(v,w,h)=>v?[v[0]*w+v[1],v[2]*h+v[3]]:[0,0];
 function natural(n,pw,ph){
  const p=n.props;let [w,h]=dim(p.Size,pw,ph);
  if((p.AutomaticSize==='X'||p.AutomaticSize==='XY')&&w===0){
   if(p.Text!==undefined)w=Math.max(1,p.Text.length*(p.TextSize||17)*.6);
   else{const children=n.children.filter(c=>!c.class.startsWith('UI'));const list=n.children.find(c=>c.class==='UIListLayout');const pad=n.children.find(c=>c.class==='UIPadding')?.props||{};const sizes=children.map(c=>natural(c,0,h)[0]);w=(list?.props.FillDirection==='Horizontal'?sizes.reduce((a,b)=>a+b,0)+(sizes.length-1)*(list.props.Padding?.[1]||0):Math.max(0,...sizes))+(pad.PaddingLeft?.[1]||0)+(pad.PaddingRight?.[1]||0);}
  }
  if(p.AutomaticSize==='Y'&&h===0)h=(p.TextSize||16)*1.3;
  const ratio=n.children.find(c=>c.class==='UIAspectRatioConstraint');if(ratio){h=Math.min(h,w/(ratio.props.AspectRatio||1));w=Math.min(w,h*(ratio.props.AspectRatio||1));}return[w,h];
 }
 function draw(n,parent,pw,ph,forced){
  const p=n.props;if(p.Visible===false||(!['Frame','ScrollingFrame','TextLabel','TextButton','ImageLabel','ImageButton'].includes(n.class)))return;
  let [w,h]=natural(n,pw,ph);let [x,y]=dim(p.Position,pw,ph);if(forced){x=forced[0];y=forced[1];}const ap=p.AnchorPoint||[0,0];x-=ap[0]*w;y-=ap[1]*h;
  const el=document.createElement('div');el.className='node';el.dataset.name=n.name;
  const style=el.style;Object.assign(style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',zIndex:p.ZIndex||1,background:color(p.BackgroundColor3,1-(p.BackgroundTransparency||0)),overflow:p.ClipsDescendants?'hidden':'visible'});
  if(p.Rotation)style.transform=`rotate(${p.Rotation}deg)`;
  const corner=n.children.find(c=>c.class==='UICorner');if(corner){const r=corner.props.CornerRadius||[0,0];style.borderRadius=Math.min(w,h)*r[0]+r[1]+'px';}
  const stroke=n.children.find(c=>c.class==='UIStroke');if(stroke&&!p.Text)style.boxShadow=`0 0 0 ${stroke.props.Thickness||1}px ${color(stroke.props.Color,1-(stroke.props.Transparency||0))}`;
  const gradient=n.children.find(c=>c.class==='UIGradient');if(gradient&&(p.BackgroundTransparency||0)<1){const g=gradient.props;let stops=(g.Color||[[0,[1,1,1]],[1,[1,1,1]]]).map(([t,v])=>{const k=(g.Transparency||[]).find(k=>k[0]===t);return color(mul(p.BackgroundColor3,v),(1-(p.BackgroundTransparency||0))*(1-(k?.[1]||0)))+' '+t*100+'%'});style.background=`linear-gradient(${90+(g.Rotation||0)}deg,${stops.join(',')})`;}
  if(p.Text){const text=document.createElement('div');const pad=n.children.find(c=>c.class==='UIPadding')?.props||{};const val=(v,total)=>v?v[0]*total+v[1]:0;const pl=val(pad.PaddingLeft,w),pr=val(pad.PaddingRight,w),pt=val(pad.PaddingTop,h),pb=val(pad.PaddingBottom,h);let size=p.TextSize||16;const limit=n.children.find(c=>c.class==='UITextSizeConstraint');if(p.TextScaled){size=limit?.props.MaxTextSize||size;const min=limit?.props.MinTextSize||8;while(size>min){const counts=p.Text.split('\n').map(s=>s.length*size*.57);const lines=p.TextWrapped?counts.reduce((sum,width)=>sum+Math.max(1,Math.ceil(width/Math.max(1,w-pl-pr))),0):counts.length;if(lines*size*1.15<=h-pt-pb&&(p.TextWrapped||Math.max(...counts)<=w-pl-pr))break;size--;}}Object.assign(text.style,{width:'100%',height:'100%',display:'flex',alignItems:p.TextYAlignment==='Top'?'flex-start':p.TextYAlignment==='Bottom'?'flex-end':'center',justifyContent:p.TextXAlignment==='Left'?'flex-start':p.TextXAlignment==='Right'?'flex-end':'center',padding:`${pt}px ${pr}px ${pb}px ${pl}px`,fontSize:size+'px',fontFamily:p.Font==='Garamond'?'Georgia,serif':'Arial,sans-serif',fontWeight:(p.Font||'').includes('Bold')?'700':'500',color:color(p.TextColor3,1-(p.TextTransparency||0)),lineHeight:'1.2',textAlign:(p.TextXAlignment||'Center').toLowerCase(),whiteSpace:p.TextWrapped?'pre-wrap':'pre'});text.textContent=p.Text;el.append(text);}
  if(p.Image&&images[p.Image]&&(p.ImageTransparency||0)<1){const image=images[p.Image],crop=p.ImageRectSize||[0,0],off=p.ImageRectOffset||[0,0];const cw=Math.abs(crop[0])||image.width,ch=Math.abs(crop[1])||image.height;const sx=w/cw,sy=h/ch;const pixels=document.createElement('div');Object.assign(pixels.style,{width:'100%',height:'100%',opacity:1-(p.ImageTransparency||0),backgroundImage:`url(${image.url})`,backgroundSize:`${image.width*sx}px ${image.height*sy}px`,backgroundPosition:`${-(off[0]-(crop[0]<0?cw:0))*sx}px ${-off[1]*sy}px`,imageRendering:'pixelated',transform:crop[0]<0?'scaleX(-1)':'none'});if((p.ImageColor3||[1,1,1])[0]<.4)pixels.style.filter='brightness(.08)';el.append(pixels);}
  parent.append(el);let host=el;
  if(n.class==='ScrollingFrame'){host=document.createElement('div');Object.assign(host.style,{position:'absolute',inset:'0',transform:`translate(${-((p.CanvasPosition||[0,0])[0])}px,0)`});el.append(host);}
  const list=n.children.find(c=>c.class==='UIListLayout');let cursor=0;
  const children=n.children.filter(c=>!c.class.startsWith('UI')).sort((a,b)=>(list?(a.props.LayoutOrder||0)-(b.props.LayoutOrder||0):0));
  if(list){const total=children.reduce((sum,c)=>sum+natural(c,w,h)[list.props.FillDirection==='Horizontal'?0:1],0)+Math.max(0,children.length-1)*(list.props.Padding?.[1]||0);if(list.props.FillDirection==='Horizontal')cursor=list.props.HorizontalAlignment==='Right'?w-total:list.props.HorizontalAlignment==='Center'?(w-total)/2:0;else cursor=list.props.VerticalAlignment==='Bottom'?h-total:list.props.VerticalAlignment==='Center'?(h-total)/2:0;}
  for(const child of children){let f;if(list){const [cw,ch]=natural(child,w,h);const horizontal=list.props.FillDirection==='Horizontal';const y=list.props.VerticalAlignment==='Center'?(h-ch)/2:0;f=horizontal?[cursor,y]:[0,cursor];cursor+=(horizontal?cw:ch)+(list.props.Padding?.[1]||0);}draw(child,host,w,h,f);}
 }
 const labels=['Лобби','Долина','Перевал','Город','Пепел','Врата','Наведение'];
 function show(i){document.querySelector('#stage').innerHTML='';const pg=pages[i];draw(pg.background,document.querySelector('#stage'),960,540);draw(pg.layout,document.querySelector('#stage'),960,540);document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('active',i===j));}
 labels.forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>show(i);document.querySelector('#nav').append(b);});const resize=()=>{document.querySelector('#stage').style.zoom=Math.min(1,(innerWidth-32)/960,innerHeight/540);document.querySelector('nav').style.flexWrap='wrap';};addEventListener('resize',resize);resize();show(1);
});
</script></html>
